name: Installer regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl python3 curl iproute2 xz-utils
      - name: Installer and failure-path regressions
        run: bash tests/test_installer.sh
      - name: Resolve the live official stable release
        shell: bash
        run: |
          source ./install.sh
          resolve_release
      - name: Real Trojan forwarding and certificate hot reload on 8443
        shell: bash
        run: |
          source ./install.sh
          # Keep proxy integration tests reproducible; latest metadata has separate tests.
          REQUESTED_TROJAN_VERSION=v1.16.0
          resolve_release
          curl --proto '=https' --tlsv1.2 -fL --retry 2 --connect-timeout 15 --max-time 120 \
            "${TROJAN_URL}" -o "${RUNNER_TEMP}/${TROJAN_TARBALL}"
          printf '%s  %s\n' "${TROJAN_SHA256}" "${RUNNER_TEMP}/${TROJAN_TARBALL}" | sha256sum -c -
          tar --no-same-owner -xJf "${RUNNER_TEMP}/${TROJAN_TARBALL}" -C "${RUNNER_TEMP}"
          TROJAN_BIN="${RUNNER_TEMP}/trojan/trojan" TEST_SERVER_PORT=8443 bash tests/test_local_proxy.sh
      - name: Default privileged TCP 443 listener and hot reload
        run: sudo env TROJAN_BIN="${RUNNER_TEMP}/trojan/trojan" TEST_SERVER_PORT=443 bash tests/test_local_proxy.sh
